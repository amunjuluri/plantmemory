[project]
name = "plantmemory"
version = "0.1.0"
description = "Finds how a plant problem was solved before, by meaning, and drafts a cited troubleshooting note for human approval."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.40",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.1",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "google-genai>=2.29",
    "google-adk>=2.11",
    "google-cloud-firestore>=2.34",
    "numpy>=2.5",
    "httpx>=0.28",
    "pypdfium2>=5.14.0",
    "pillow>=12.3.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx2>=2.13.1",
    "matplotlib>=3.11.2",
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # str.split() word lists read better than long literals

[tool.ruff.lint.per-file-ignores]
# Builds Markdown tables row by row; wrapping them would hide the table shape.
"scripts/benchmark_report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
